[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "slm-lab"
version = "0.1.0"
description = "Local small language model experiments"
requires-python = ">=3.11,<3.14"
dependencies = [
  "torch>=2.5",
  "transformers>=4.45,<6",
  "datasets>=3,<5",
  "accelerate>=1,<2",
  "tokenizers>=0.20",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8"]

[tool.setuptools.packages.find]
where = ["src"]

